<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fusion – Style Status</title>
<style>
:root{--bg:#faf7f5;--card:#fff;--tx:#1d1a1c;--mu:#7a7176;--ac:#d6336c;--ln:#eadfe3;--chip:#f4e9ee}
@media (prefers-color-scheme:dark){:root{--bg:#151215;--card:#211c20;--tx:#f4eef1;--mu:#a89ca3;--ac:#ff6b9d;--ln:#352d33;--chip:#2d242b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;max-width:520px;margin:0 auto;min-height:100vh}
h1{font-size:26px;margin:0 0 4px}h2{font-size:18px;margin:16px 0 8px}
.p{padding:16px 16px 90px}.mu{color:var(--mu);font-size:14px}
input,textarea{width:100%;padding:12px;margin:6px 0;border:1px solid var(--ln);border-radius:12px;background:var(--card);color:var(--tx);font:inherit}
button{font:inherit;cursor:pointer}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:12px 16px;width:100%;font-weight:600;margin-top:8px}
.btn.s{width:auto;padding:8px 14px;margin:0}.btn.o{background:var(--chip);color:var(--tx)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:12px;margin:10px 0}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}
.pic{width:100%;aspect-ratio:4/5;border-radius:12px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:90px;object-fit:cover;margin:8px 0}
.chip{display:inline-block;background:var(--chip);border-radius:20px;padding:4px 10px;font-size:13px}
.stars button{background:none;border:0;font-size:28px;color:var(--ln);padding:2px}.stars button.on{color:#f5a623}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;display:flex;background:var(--card);border-top:1px solid var(--ln)}
nav button{flex:1;background:none;border:0;padding:12px 0;color:var(--mu);font-size:12px}nav button.on{color:var(--ac);font-weight:700}nav span{display:block;font-size:20px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:var(--card);border-radius:20px 20px 0 0;padding:20px;max-height:80vh;overflow:auto;width:100%;max-width:520px}
.chk{display:flex;gap:10px;align-items:flex-start;margin:12px 0;font-size:14px}.chk input{width:20px;margin:2px 0}
.err{color:#d93025;font-size:14px;min-height:18px}
.lnk{color:var(--ac);background:none;border:0;padding:0;text-decoration:underline}
.av{width:40px;height:40px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:22px;flex:0 0 auto}
</style>
</head>
<body>
<div id="app"><div class="p mu">Loading…</div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,setDoc,getDoc,getDocs,addDoc,updateDoc,deleteDoc,collection,query,where,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyAcfE1stPLQLe3qI6HNDx9qfHZPe7cc8Ps",
  authDomain: "fution-style.firebaseapp.com",
  projectId: "fution-style",
  storageBucket: "fution-style.firebasestorage.app",
  messagingSenderId: "506861931151",
  appId: "1:506861931151:web:f871c4619522e429737efa"
};
const fb=initializeApp(firebaseConfig),auth=getAuth(fb),db=getFirestore(fb);
const TYPES=[["Casual","👕"],["Formal","🤵"],["Streetwear","🧢"],["Sporty","🏃"],["Party","🪩"],["Traditional","👘"],["Work","💼"],["Date night","🌹"]];
const FACES=["😎","🙂","😄","🤩","🥳","😊","🧑‍🎤","💃"];
const $=id=>document.getElementById(id);
const esc=t=>String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let me=null,prof=null,P={},rIn=[],rOut=[],posts=[],tab="feed",modal=null,mode="signup",err="",msg="",found=null,draft={type:"Casual",img:null},unsubs=[],postKey="";
const face=u=>FACES[(u||"").charCodeAt(0)%FACES.length||0];
function name(u){if(u===me.uid)return"You";if(P[u])return P[u].name;P[u]={name:"…",username:""};getDoc(doc(db,"users",u)).then(s=>{if(s.exists()){P[u]=s.data();render()}});return"…"}
const reqs=()=>[...rIn,...rOut];
const friends=()=>reqs().filter(r=>r.status==="accepted").map(r=>r.from===me.uid?r.to:r.from);
const ago=t=>{const m=Math.floor((Date.now()-t)/6e4);return m<1?"just now":m<60?m+"m ago":Math.floor(m/60)+"h ago"};
const live=()=>posts.filter(p=>Date.now()-p.ts<864e5).sort((a,b)=>b.ts-a.ts);
const avg=p=>{const v=Object.values(p.ratings||{});return v.length?(v.reduce((a,b)=>a+b,0)/v.length).toFixed(1):null};

function render(){
  let h=!me?authView():!prof?'<div class="p mu">Setting up your account…</div>':mainView();
  if(modal==="terms")h+=termsView();
  $("app").innerHTML=h;
}
function authView(){
  const su=mode==="signup";
  return `<div class="p"><div style="font-size:48px">👗</div><h1>Fusion</h1><p class="mu">Share your style. Let your friends rate it.</p><h2>${su?"Create your account":"Log in"}</h2>`+
  (su?'<input id="nm" placeholder="Full name" autocomplete="name"><input id="un" placeholder="Username (e.g. sam_style)" autocapitalize="none">':"")+
  '<input id="em" type="email" placeholder="Email" autocomplete="email"><input id="pw" type="password" placeholder="Password (6+ characters)">'+
  (su?'<label class="chk"><input type="checkbox" id="tc"><span>I agree to the <button class="lnk" onclick="openTerms()">Terms &amp; Conditions</button> and Privacy Policy</span></label>':"")+
  `<div class="err" id="er">${esc(err)}</div><button class="btn" onclick="${su?"signup()":"login()"}">${su?"Create account":"Log in"}</button>`+
  `<p class="mu" style="text-align:center">${su?"Already have an account?":"New here?"} <button class="lnk" onclick="setMode('${su?"login":"signup"}')">${su?"Log in":"Sign up"}</button></p></div>`;
}
const setMode=m=>{mode=m;err="";render()};
const openTerms=()=>{modal="terms";render()};
const closeM=()=>{modal=null;render()};
const setErr=m=>{err=m;if($("er"))$("er").textContent=m};
const nice=e=>({"auth/email-already-in-use":"That email already has an account.","auth/invalid-email":"Enter a valid email address.","auth/weak-password":"Password needs 6+ characters.","auth/invalid-credential":"Wrong email or password.","auth/network-request-failed":"No internet connection."}[e.code]||"Something went wrong. Try again.");
async function signup(){
  const n=$("nm").value.trim(),u=$("un").value.trim().replace(/^@/,"").toLowerCase().replace(/[^a-z0-9_.]/g,""),e=$("em").value.trim(),p=$("pw").value;
  if(!n||!u||!e||p.length<6)return setErr("Please fill in every field (password 6+ characters).");
  if(!$("tc").checked)return setErr("You must accept the Terms & Conditions to continue.");
  try{
    const c=await createUserWithEmailAndPassword(auth,e,p);
    let un=u;const q=await getDocs(query(collection(db,"users"),where("username","==",un)));
    if(!q.empty)un=u+(100+Math.floor(Math.random()*900));
    await setDoc(doc(db,"users",c.user.uid),{name:n,username:un,termsAccepted:true,termsAt:Date.now()});
  }catch(x){setErr(nice(x))}
}
async function login(){
  const e=$("em").value.trim(),p=$("pw").value;
  if(!e||!p)return setErr("Enter your email and password.");
  try{await signInWithEmailAndPassword(auth,e,p)}catch(x){setErr(nice(x))}
}
function termsView(){
  return `<div class="ov" onclick="closeM()"><div class="sheet" onclick="event.stopPropagation()"><h2>Terms &amp; Conditions</h2><p class="mu">Sample text. Have an adult or lawyer review before you share the app widely.</p>
  <p><b>1. Eligibility.</b> You must be 13 or older to use Fusion.</p>
  <p><b>2. Your content.</b> You own the outfit photos and captions you post. You allow Fusion to show them to your friends.</p>
  <p><b>3. Status updates.</b> Style statuses disappear from the feed after 24 hours.</p>
  <p><b>4. Respectful ratings.</b> Be kind. Harassment, body-shaming, nudity and hate are not allowed and may lead to removal.</p>
  <p><b>5. Privacy.</b> We never sell your personal data. Your email is used only to log you in.</p>
  <p><b>6. Account.</b> You are responsible for your password.</p>
  <button class="btn" onclick="closeM()">Close</button></div></div>`;
}
function mainView(){
  const b={feed:feedView,post:postView,friends:friendsView,me:meView}[tab]();
  const t=[["feed","🏠","Feed"],["post","➕","Post"],["friends","👥","Friends"],["me","🙂","Me"]];
  const n=rIn.filter(r=>r.status==="pending").length;
  return `<div class="p">${b}</div><nav>${t.map(x=>`<button class="${tab===x[0]?"on":""}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}${x[0]==="friends"&&n?" ("+n+")":""}</button>`).join("")}</nav>`;
}
const go=t=>{tab=t;msg="";render()};
function feedView(){
  const ps=live();
  let h='<h1>Style Status</h1><p class="mu">Fresh looks from the last 24 hours</p>';
  if(!ps.length)h+='<div class="card mu">No looks yet. Add friends or post your first outfit!</div>';
  ps.forEach(p=>{
    const mine=p.by===me.uid,a=avg(p),my=(p.ratings||{})[me.uid]||0;
    h+=`<div class="card"><div class="row sp"><div class="row"><div class="av">${face(name(p.by))}</div><div><b>${esc(name(p.by))}</b><div class="mu">${ago(p.ts)}</div></div></div><span class="chip">${esc(p.type)}</span></div>`+
    (p.img?`<img class="pic" src="${p.img}" alt="Outfit">`:`<div class="pic">${esc(p.emoji)}</div>`)+
    (p.cap?`<div>${esc(p.cap)}</div>`:"")+
    `<div class="row sp" style="margin-top:6px"><div class="stars">${mine?"":[1,2,3,4,5].map(n=>`<button class="${my>=n?"on":""}" onclick="rate('${p.id}',${n})">★</button>`).join("")}</div><div class="mu">${a?"★ "+a+" · "+Object.keys(p.ratings).length+" ratings":"No ratings yet"}</div></div></div>`;
  });
  return h;
}
const rate=(id,n)=>updateDoc(doc(db,"posts",id),{["ratings."+me.uid]:n}).catch(()=>alert("Could not save your rating."));
function postView(){
  return '<h1>Post your style</h1><p class="mu">Your friends see it for 24 hours</p><div class="card"><div class="mu">Outfit type</div><div style="display:flex;flex-wrap:wrap;gap:8px;margin:8px 0">'+
  TYPES.map(t=>`<button class="btn s ${draft.type===t[0]?"":"o"}" onclick="setType('${t[0]}')">${t[1]} ${t[0]}</button>`).join("")+
  '</div><div class="mu">Photo (optional)</div><input type="file" accept="image/*" onchange="pick(this)">'+(draft.img?`<img class="pic" src="${draft.img}" alt="Preview">`:"")+
  '<textarea id="cp" rows="2" placeholder="What are you wearing today?"></textarea><button class="btn" id="pb" onclick="publish()">Share status</button></div>';
}
const setType=t=>{const c=$("cp")?$("cp").value:"";draft.type=t;render();$("cp").value=c};
function pick(el){
  const f=el.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,500/im.width),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);draft.img=c.toDataURL("image/jpeg",.7);const cap=$("cp").value;render();$("cp").value=cap};im.src=r.result};r.readAsDataURL(f);
}
async function publish(){
  $("pb").disabled=true;
  try{await addDoc(collection(db,"posts"),{by:me.uid,type:draft.type,cap:$("cp").value.trim(),img:draft.img,emoji:TYPES.find(t=>t[0]===draft.type)[1],ts:Date.now(),ratings:{}});draft={type:"Casual",img:null};tab="feed";render()}
  catch(x){alert("Could not post. Check your connection and try again.");$("pb").disabled=false}
}
function friendsView(){
  let h='<h1>Friends</h1><p class="mu">Find friends by their username</p><div class="row"><input id="fu" placeholder="Username" autocapitalize="none"><button class="btn s" onclick="findF()">Search</button></div>';
  if(msg)h+=`<div class="mu">${esc(msg)}</div>`;
  if(found)h+=`<div class="card row sp"><div class="row"><div class="av">${face(found.name)}</div><div><b>${esc(found.name)}</b><div class="mu">@${esc(found.username)}</div></div></div><button class="btn s" onclick="sendReq('${found.uid}')">Add</button></div>`;
  const inc=rIn.filter(r=>r.status==="pending");
  if(inc.length){h+="<h2>Requests</h2>";inc.forEach(r=>{h+=`<div class="card row sp"><b>${esc(name(r.from))}</b><div class="row"><button class="btn s" onclick="acc('${r.id}')">Accept</button><button class="btn s o" onclick="del('${r.id}')">Decline</button></div></div>`})}
  const f=reqs().filter(r=>r.status==="accepted");
  h+=`<h2>Your friends (${f.length})</h2>`;
  if(!f.length)h+='<div class="card mu">No friends yet.</div>';
  f.forEach(r=>{const u=r.from===me.uid?r.to:r.from;h+=`<div class="card row sp"><div class="row"><div class="av">${face(name(u))}</div><b>${esc(name(u))}</b></div><button class="btn s o" onclick="del('${r.id}')">Remove</button></div>`});
  const out=rOut.filter(r=>r.status==="pending");
  if(out.length){h+="<h2>Waiting for reply</h2>";out.forEach(r=>{h+=`<div class="card row sp"><span>${esc(name(r.to))}</span><button class="btn s o" onclick="del('${r.id}')">Cancel</button></div>`})}
  return h;
}
async function findF(){
  const u=$("fu").value.trim().replace(/^@/,"").toLowerCase();found=null;msg="";
  if(!u){msg="Type a username first.";return render()}
  try{const q=await getDocs(query(collection(db,"users"),where("username","==",u)));
    if(q.empty)msg="No user found with that username.";
    else{const d=q.docs[0];if(d.id===me.uid)msg="That's you!";else if(reqs().some(r=>r.from===d.id||r.to===d.id))msg="You already have a request or friendship with them.";else{found={uid:d.id,...d.data()};P[d.id]=d.data()}}
  }catch(x){msg="Search failed. Try again."}
  render();
}
const sendReq=async to=>{found=null;msg="Request sent!";try{await addDoc(collection(db,"requests"),{from:me.uid,to,status:"pending",ts:Date.now()})}catch(x){msg="Could not send the request."}render()};
const acc=id=>updateDoc(doc(db,"requests",id),{status:"accepted"});
const del=id=>deleteDoc(doc(db,"requests",id));
function meView(){
  const mine=posts.filter(p=>p.by===me.uid),all=mine.flatMap(p=>Object.values(p.ratings||{})),a=all.length?(all.reduce((x,y)=>x+y,0)/all.length).toFixed(1):"–";
  return `<h1>${esc(prof.name)}</h1><p class="mu">@${esc(prof.username)}</p><div class="card row sp"><div><b>${mine.length}</b><div class="mu">Looks</div></div><div><b>${friends().length}</b><div class="mu">Friends</div></div><div><b>★ ${a}</b><div class="mu">Avg rating</div></div></div><button class="btn o" onclick="openTerms()">Terms &amp; Conditions</button><button class="btn o" onclick="logout()">Log out</button>`;
}
const logout=()=>signOut(auth);
function stop(){unsubs.forEach(f=>f());unsubs=[];postKey=""}
function subPosts(){
  const ids=[me.uid,...friends()].slice(0,30),k=ids.join();if(k===postKey)return;postKey=k;
see  if(unsubs.postU)unsubs.postU();
  const u=onSnapshot(query(collection(db,"posts"),where("by","in",ids)),s=>{posts=s.docs.map(d=>({id:d.id,...d.data()}));render()});
  unsubs.postU=u;
}
function sub(){
  const ch=()=>{subPosts();render()};
  unsubs.push(onSnapshot(query(collection(db,"requests"),where("to","==",me.uid)),s=>{rIn=s.docs.map(d=>({id:d.id,...d.data()}));ch()}));
  unsubs.push(onSnapshot(query(collection(db,"requests"),where("from","==",me.uid)),s=>{rOut=s.docs.map(d=>({id:d.id,...d.data()}));ch()}));
  unsubs.push(()=>{if(unsubs.postU)unsubs.postU()});
}
async function boot(u){
  me=u;prof=null;render();
  for(let i=0;i<10&&!prof;i++){const s=await getDoc(doc(db,"users",u.uid));if(s.exists())prof=s.data();else await new Promise(r=>setTimeout(r,500))}
  if(!prof)return;P[u.uid]=prof;tab="feed";sub();render();
}
onAuthStateChanged(auth,u=>{stop();rIn=[];rOut=[];posts=[];if(u)boot(u);else{me=null;prof=null;render()}});
Object.assign(window,{signup,login,setMode,openTerms,closeM,go,rate,setType,pick,publish,findF,sendReq,acc,del,logout});
render();
</script>
</body>
  </html>
